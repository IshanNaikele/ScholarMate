services:
  - type: web
    name: scholarmate-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free

    build:
      pythonVersion: 3.11
      systemPackages:
        - ffmpeg

    envVars:
      - key: GROQ_API_KEY
         # Optional placeholder; safer to set in Render UI
      - key: GROQ_API_KEY_NEW
         
      - key: GROQ_API_KEY_MCQ
         
      - key: GROQ_API_KEY_QA
        
