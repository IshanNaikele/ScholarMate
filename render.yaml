services:
  - type: web
    name: scholarmate-backend
    env: python
    pythonVersion: 3.11             # ✅ Must be at top-level, NOT under 'build'
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    systemPackages:                 # ✅ Must be top-level, NOT nested
      - ffmpeg
    envVars:                        # ✅ You can sync keys in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_NEW
        sync: false
      - key: GROQ_API_KEY_MCQ
        sync: false
      - key: GROQ_API_KEY_QA
        sync: false
